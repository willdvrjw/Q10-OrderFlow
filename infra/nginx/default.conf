server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API bajo el mismo origen que el navegador, sin CORS adicional.
    location ~ ^/(orders|products|health)(/|$) {
        proxy_pass http://orders-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # SignalR: admite negociación HTTP y conexiones WebSocket.
    location /hubs/orders {
        proxy_pass http://orders-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: mantener la interfaz al navegar a rutas propias del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
