server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker puede reasignar IP a los contenedores al recrearlos.
    # Resolver DNS embebido de Docker por petición con caché breve:
    # evita conservar direcciones de Orders/Inventory obsoletas.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $orders_backend orders-api:8080;
    set $inventory_backend inventory-worker:8081;

    # API bajo el mismo origen que el navegador, sin CORS adicional.
    location ~ ^/(orders|products|health)(/|$) {
        proxy_pass http://$orders_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Readiness del segundo backend; evita declarar saludable el frontend
    # si Orders responde pero Inventory no puede acceder a PostgreSQL.
    location = /inventory/health/ready {
        proxy_pass http://$inventory_backend/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # Inventory mantiene la propiedad de las existencias; Orders no toca stock.
    location /inventory {
        proxy_pass http://$inventory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Notificaciones de existencias en vivo sin añadir estados a los pedidos.
    location /hubs/inventory {
        proxy_pass http://$inventory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SignalR: admite negociación HTTP y conexiones WebSocket.
    location /hubs/orders {
        proxy_pass http://$orders_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: mantener la interfaz al navegar a rutas propias del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
