# OrderFlow: docker compose up arranca todos los servicios sin pasos manuales.
# Contraseñas predeterminadas EXCLUSIVAMENTE de demostración. No usar en producción.
# Para despliegues reales, proporcionar las variables desde un gestor de secretos.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: ${ORDERFLOW_PG_PASSWORD:-orderflow_demo_local_only}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: orderflow
      RABBITMQ_DEFAULT_PASS: ${ORDERFLOW_RMQ_PASSWORD:-orderflow_demo_local_only}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  orders-api:
    build:
      context: .
      dockerfile: src/Orders.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orderflow_orders;Username=orderflow;Password=${ORDERFLOW_PG_PASSWORD:-orderflow_demo_local_only}
      Inventory__BaseUrl: http://inventory-worker:8081
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: orderflow
      RabbitMq__Password: ${ORDERFLOW_RMQ_PASSWORD:-orderflow_demo_local_only}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  inventory-worker:
    build:
      context: .
      dockerfile: src/Inventory.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8081
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=orderflow_inventory;Username=orderflow;Password=${ORDERFLOW_PG_PASSWORD:-orderflow_demo_local_only}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: orderflow
      RabbitMq__Password: ${ORDERFLOW_RMQ_PASSWORD:-orderflow_demo_local_only}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    # Solo se expone en la máquina del evaluador; no publica las API administrativas
    # en la red local. Cambiar ORDERFLOW_WEB_PORT si 8080 está ocupado.
    ports:
      - "127.0.0.1:${ORDERFLOW_WEB_PORT:-8080}:80"
    # Muestra el estado real en docker compose ps mientras el backend termina
    # de preparar las tablas y el catálogo. Nginx Alpine incluye BusyBox wget.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    depends_on:
      orders-api:
        condition: service_started
      inventory-worker:
        condition: service_started

  # Cinco pruebas reales: tres de dominio y dos sobre PostgreSQL.
  # No participa del arranque por defecto ni modifica las bases de los servicios.
  backend-tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: tests/OrderFlow.Tests/Dockerfile
    environment:
      ORDERFLOW_TEST_POSTGRES: Host=postgres;Port=5432;Database=postgres;Username=orderflow;Password=${ORDERFLOW_PG_PASSWORD:-orderflow_demo_local_only}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
